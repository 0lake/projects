[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-scraper"
version = "1.0.0"
description = "Scrape the Wikipedia table of goat breeds into CSV and an HTML gallery"
requires-python = ">=3.10"
dependencies = ["requests", "beautifulsoup4", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
goat-scraper = "goat_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
