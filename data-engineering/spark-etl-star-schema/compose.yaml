# PostgreSQL (star schema), ClickHouse and MongoDB (marts), Spark, ETL job.
#   docker compose up -d                 # databases only
#   docker compose run --rm etl          # run the whole pipeline
#   docker compose --profile cluster up  # optional Spark master and worker (UI on :8080)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pipeline]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pipeline]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pipeline]

  etl:
    build: .
    profiles: ["etl"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
    volumes:
      - ./data:/data:ro
      - ivy_cache:/root/.ivy2
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      mongo: { condition: service_healthy }
    command: ["python", "-m", "etl_star.run", "--stage", "all", "--source", "/data/mock_data*.csv"]
    networks: [pipeline]

  spark-master:
    image: apache/spark:3.5.3
    profiles: ["cluster"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    networks: [pipeline]

  spark-worker:
    image: apache/spark:3.5.3
    profiles: ["cluster"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    networks: [pipeline]

volumes:
  pg_data:
  ch_data:
  mongo_data:
  ivy_cache:

networks:
  pipeline:
