name: data-engineering tests

on:
  push:
    paths:
      - "data-engineering/**"
      - ".github/workflows/data-engineering-ci.yml"
  pull_request:
    paths:
      - "data-engineering/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [spark-etl-star-schema, web-scraping-goat-breeds]
    defaults:
      run:
        working-directory: data-engineering/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
