name: ml-insurance-ci

on:
  push:
    paths:
      - "ml/health-insurance-rate-modeling/**"
      - ".github/workflows/ml-insurance-ci.yml"
  pull_request:
    paths:
      - "ml/health-insurance-rate-modeling/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/health-insurance-rate-modeling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
