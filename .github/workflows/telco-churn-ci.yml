name: telco-churn tests

on:
  push:
    paths:
      - "ml/telco-churn-prediction/**"
      - ".github/workflows/telco-churn-ci.yml"
  pull_request:
    paths:
      - "ml/telco-churn-prediction/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/telco-churn-prediction
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ml/telco-churn-prediction/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
