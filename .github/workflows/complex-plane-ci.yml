name: complex-plane tests

on:
  push:
    paths:
      - "math/complex-plane-fractals/**"
      - ".github/workflows/complex-plane-ci.yml"
  pull_request:
    paths:
      - "math/complex-plane-fractals/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: math/complex-plane-fractals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: math/complex-plane-fractals/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,pdf]"
      - name: Tests
        run: pytest -q
