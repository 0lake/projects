[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complexplane"
version = "1.0.0"
description = "Фракталы и конформные отображения на комплексной плоскости: Мандельброт, Жюлиа, бассейны Ньютона"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["img2pdf>=0.5"]

[project.scripts]
complexplane = "complexplane.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
