[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-rates"
version = "1.0.0"
description = "Classification and regression of US health insurance marketplace rates without target leakage"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "seaborn"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
insurance-rates = "insurance_rates.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
