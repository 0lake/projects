[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn"
version = "1.0.0"
description = "Predicting telecom customer churn: pipeline, evaluation, explanations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
notebooks = ["jupyterlab", "seaborn", "plotly", "phik", "sweetviz"]

[project.scripts]
churn-train = "churn.train:main"
churn-predict = "churn.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
