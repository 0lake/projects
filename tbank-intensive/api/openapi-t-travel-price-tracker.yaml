              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '404':
          description: Уведомление не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOTIFICATION_NOT_FOUND
                  message: Уведомление не найдено
        '422':
          description: Ошибка валидации полей запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Ошибка валидации полей запроса
                  details:
                  - field: message
                    issue: не должно быть пустым
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    delete:
      tags:
      - Notifications
      summary: Удалить уведомление
      description: Например, отозвать ещё не отправленное уведомление, если у пользователя закончился
        Т-Премиум.
      operationId: deleteNotification
      responses:
        '204':
          description: Уведомление успешно удалено
        '400':
          description: Некорректный идентификатор уведомления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректный идентификатор уведомления
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Недостаточно прав для удаления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Недостаточно прав для удаления
        '404':
          description: Уведомление не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOTIFICATION_NOT_FOUND
                  message: Уведомление не найдено
        '409':
          description: Уведомление уже отправлено и не может быть удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOTIFICATION_CONFLICT
                  message: Уведомление уже отправлено и не может быть удалено
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      description: Уникальный идентификатор запроса для трассировки (генерируется клиентом)
      required: false
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      description: Идентификатор пользователя
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      description: Идентификатор подписки
      required: true
      schema:
        type: string
        format: uuid
    OfferIdPath:
      name: offerId
      in: path
      description: Идентификатор варианта перелёта
      required: true
      schema:
        type: string
        format: uuid
    NotificationIdPath:
      name: notificationId
      in: path
      description: Идентификатор уведомления
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 134
        totalPages:
          type: integer
          example: 7
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Поле departureDate обязательно для заполнения
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: departureDate
              issue:
                type: string
                example: должно быть датой в будущем
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    TPremiumStatus:
      type: string
      enum:
      - none
      - t_premium
      - private
      description: Статус подписки клиента на привилегии Т-Банка
    SubscriptionStatus:
      type: string
      enum:
      - active
      - paused
      - completed
      - cancelled
    NotificationType:
      type: string
      enum:
      - price_drop
      - personalized_recommendation
    NotificationStatus:
      type: string
      enum:
      - queued
      - sent
      - delivered
      - read
      - failed
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        fullName:
          type: string
          example: Олег Иванов
        email:
          type: string
          format: email
          example: oleg.ivanov@example.com
        phone:
          type: string
          example: '+79161234567'
        tPremiumStatus:
          $ref: '#/components/schemas/TPremiumStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:00:00Z'
    UserCreateRequest:
      type: object
      required:
      - fullName
      - email
      - phone
      properties:
        fullName:
          type: string
          example: Олег Иванов
        email:
          type: string
          format: email
          example: oleg.ivanov@example.com
        phone:
          type: string
          example: '+79161234567'
        tPremiumStatus:
          $ref: '#/components/schemas/TPremiumStatus'
    UserUpdateRequest:
      type: object
      required:
      - fullName
      - email
      - phone
      - tPremiumStatus
      properties:
        fullName:
          type: string
          example: Олег Иванов
        email:
          type: string
          format: email
          example: oleg.ivanov@example.com
        phone:
          type: string
          example: '+79161234567'
        tPremiumStatus:
          $ref: '#/components/schemas/TPremiumStatus'
    UserPatchRequest:
      type: object
      description: Все поля необязательны, обновляются только переданные.
      properties:
        fullName:
          type: string
          example: Олег Иванов
        email:
          type: string
          format: email
          example: oleg.ivanov@example.com
        phone:
          type: string
          example: '+79161234567'
        tPremiumStatus:
          $ref: '#/components/schemas/TPremiumStatus'
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b3f1c2d4-1111-4a2b-9c3d-556677889900
        userId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        origin:
          type: string
          description: Код аэропорта вылета (IATA)
          example: MOW
        destination:
          type: string
          description: Код аэропорта прилёта (IATA)
          example: IST
        departureDate:
          type: string
          format: date
          example: '2026-07-27'
        returnDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-09'
        targetPrice:
          type: number
          format: float
          nullable: true
          description: Желаемая цена, при достижении которой юзер хочет получить уведомление
          example: 18000
        considerTPremiumPrivileges:
          type: boolean
          description: Включена ли опция «Учитывать привилегии Т-Премиума»
          example: true
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-08-01T09:15:00Z'
    SubscriptionCreateRequest:
      type: object
      required:
      - userId
      - origin
      - destination
      - departureDate
      properties:
        userId:
          type: string
          format: uuid
        origin:
          type: string
          example: MOW
        destination:
          type: string
          example: IST
        departureDate:
          type: string
          format: date
          example: '2026-07-27'
        returnDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-09'
        targetPrice:
          type: number
          format: float
          nullable: true
          example: 18000
        considerTPremiumPrivileges:
          type: boolean
          default: false
          example: true
    SubscriptionUpdateRequest:
      type: object
      required:
      - origin
      - destination
      - departureDate
      - considerTPremiumPrivileges
      - status
      properties:
        origin:
          type: string
          example: MOW
        destination:
          type: string
          example: IST
        departureDate:
          type: string
          format: date
          example: '2026-07-27'
        returnDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-09'
        targetPrice:
          type: number
          format: float
          nullable: true
          example: 18000
        considerTPremiumPrivileges:
          type: boolean
          example: true
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    SubscriptionPatchRequest:
      type: object
      description: Все поля необязательны, обновляются только переданные.
      properties:
        targetPrice:
          type: number
          format: float
          nullable: true
          example: 17500
        considerTPremiumPrivileges:
          type: boolean
          example: false
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    SubscriptionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Subscription'
    SubscriptionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    FlightOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 77aa1234-5678-4abc-9def-000011112222
        subscriptionId:
          type: string
          format: uuid
        airline:
          type: string
          example: Turkish Airlines
        price:
          type: number
          format: float
          example: 18700
        currency:
          type: string
          example: RUB
        departureDate:
          type: string
          format: date
          example: '2026-07-27'
        returnDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-09'
        privilegesAvailable:
          type: boolean
          description: Доступны ли привилегии Т-Премиума для этого варианта
          example: true
        loungePassesLeft:
          type: integer
          nullable: true
          example: 2
        loungePassesRenewalDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-07'
        fetchedAt:
          type: string
          format: date-time
          example: '2026-08-05T08:00:00Z'
    FlightOfferCreateRequest:
      type: object
      required:
      - subscriptionId
      - airline
      - price
      - currency
      - departureDate
      properties:
        subscriptionId:
          type: string
          format: uuid
        airline:
          type: string
          example: Turkish Airlines
        price:
          type: number
          format: float
          example: 18700
        currency:
          type: string
          example: RUB
        departureDate:
          type: string
          format: date
          example: '2026-07-27'
        returnDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-09'
        privilegesAvailable:
          type: boolean
          default: false
        loungePassesLeft:
          type: integer
          nullable: true
          example: 2
        loungePassesRenewalDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-07'
    FlightOfferUpdateRequest:
      type: object
      required:
      - airline
      - price
      - currency
      - departureDate
      - privilegesAvailable
      properties:
        airline:
          type: string
          example: Turkish Airlines
        price:
          type: number
          format: float
          example: 18500
        currency:
          type: string
          example: RUB
        departureDate:
          type: string
          format: date
          example: '2026-07-27'
        returnDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-09'
        privilegesAvailable:
          type: boolean
          example: true
        loungePassesLeft:
          type: integer
          nullable: true
          example: 1
        loungePassesRenewalDate:
          type: string
          format: date
          nullable: true
          example: '2026-08-07'
    FlightOfferPatchRequest:
      type: object
      description: Все поля необязательны, обновляются только переданные (например, только цена).
      properties:
        price:
          type: number
          format: float
          example: 18200
        loungePassesLeft:
          type: integer
          nullable: true
          example: 1
    FlightOfferResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FlightOffer'
    FlightOfferListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FlightOffer'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 99cc4321-8765-4def-9abc-111122223333
        userId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          example: Найден выгодный вариант. Во время поездки обновятся проходы в бизнес-залы Т-Премиума.
        status:
          $ref: '#/components/schemas/NotificationStatus'
        sentAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-05T09:00:00Z'
    NotificationCreateRequest:
      type: object
      required:
      - userId
      - subscriptionId
      - type
      - message
      properties:
        userId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          example: Найден выгодный вариант. Во время поездки обновятся проходы в бизнес-залы Т-Премиума.
    NotificationUpdateRequest:
      type: object
      required:
      - type
      - message
      - status
      properties:
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          example: Найден выгодный вариант.
        status:
          $ref: '#/components/schemas/NotificationStatus'
        sentAt:
          type: string
          format: date-time
          nullable: true
    NotificationPatchRequest:
      type: object
      description: Все поля необязательны, обычно используется для смены статуса.
      properties:
        status:
          $ref: '#/components/schemas/NotificationStatus'
        sentAt:
          type: string
          format: date-time
          nullable: true
    NotificationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Notification'
    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
security:
- BearerAuth: []
