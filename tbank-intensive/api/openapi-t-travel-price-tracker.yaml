openapi: 3.0.3
info:
  title: T-Travel Price Tracker API
  description: 'API сервиса «Т-Путешествия» для отслеживания цен на авиабилеты с учётом привилегий Т-Премиума.
    Позволяет управлять пользователями, подписками на отслеживание цены маршрута, найденными вариантами
    перелётов (flight offers) и уведомлениями, которые сервис отправляет при появлении выгодного варианта.

    '
  version: 1.0.0
  contact:
    name: Т-Путешествия, команда разработки
    email: api-support@t-travel.example
servers:
- url: https://api.t-bank.example/travel/v1
  description: Продуктивный сервер
- url: https://sandbox-api.t-bank.example/travel/v1
  description: Песочница для тестирования
tags:
- name: Users
  description: Клиенты Т-Банка, использующие сервис отслеживания цен
- name: Subscriptions
  description: Подписки на отслеживание цены маршрута
- name: FlightOffers
  description: Найденные варианты перелётов по подписке (цена, привилегии)
- name: Notifications
  description: Уведомления, отправленные пользователю
paths:
  /users:
    get:
      tags:
      - Users
      summary: Получить список пользователей
      description: Возвращает постраничный список пользователей с возможностью фильтрации по статусу Т-Премиум.
      operationId: listUsers
      parameters:
      - name: tPremiumStatus
        in: query
        description: Фильтр по статусу подписки Т-Премиум
        required: false
        schema:
          $ref: '#/components/schemas/TPremiumStatus'
      - name: search
        in: query
        description: Поиск по имени или email пользователя
        required: false
        schema:
          type: string
          example: ivanov
      - name: page
        in: query
        description: Номер страницы
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Количество элементов на странице
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Список пользователей успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректные параметры запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Недостаточно прав для просмотра списка пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Недостаточно прав для просмотра списка пользователей
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    post:
      tags:
      - Users
      summary: Создать пользователя
      description: Регистрирует нового пользователя сервиса отслеживания цен.
      operationId: createUser
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректное тело запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_CONFLICT
                  message: Пользователь с таким email уже существует
        '422':
          description: Ошибка валидации полей запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Ошибка валидации полей запроса
                  details:
                  - field: email
                    issue: должен быть валидным email-адресом
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
  /users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserIdPath'
    - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags:
      - Users
      summary: Получить пользователя по идентификатору
      operationId: getUserById
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Недостаточно прав для просмотра данного пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Недостаточно прав для просмотра данного пользователя
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_NOT_FOUND
                  message: Пользователь не найден
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    put:
      tags:
      - Users
      summary: Полностью заменить данные пользователя
      operationId: replaceUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Данные пользователя обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректное тело запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_NOT_FOUND
                  message: Пользователь не найден
        '422':
          description: Ошибка валидации полей запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Ошибка валидации полей запроса
                  details:
                  - field: email
                    issue: должен быть валидным email-адресом
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    patch:
      tags:
      - Users
      summary: Частично обновить данные пользователя
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: Данные пользователя частично обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректное тело запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_NOT_FOUND
                  message: Пользователь не найден
        '422':
          description: Ошибка валидации полей запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Ошибка валидации полей запроса
                  details:
                  - field: email
                    issue: должен быть валидным email-адресом
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    delete:
      tags:
      - Users
      summary: Удалить пользователя
      description: Удаляет пользователя вместе со всеми его подписками (мягкое удаление на стороне сервиса).
      operationId: deleteUser
      responses:
        '204':
          description: Пользователь успешно удалён
        '400':
          description: Некорректный идентификатор пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректный идентификатор пользователя
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Недостаточно прав для удаления пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Недостаточно прав для удаления пользователя
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_NOT_FOUND
                  message: Пользователь не найден
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
  /subscriptions:
    get:
      tags:
      - Subscriptions
      summary: Получить список подписок на отслеживание цены
      operationId: listSubscriptions
      parameters:
      - name: userId
        in: query
        description: Фильтр по идентификатору пользователя
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Фильтр по статусу подписки
        required: false
        schema:
          $ref: '#/components/schemas/SubscriptionStatus'
      - name: considerTPremiumPrivileges
        in: query
        description: Фильтр по включённой опции учёта привилегий Т-Премиума
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Список подписок успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректные параметры запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Недостаточно прав для просмотра подписок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Недостаточно прав для просмотра подписок
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    post:
      tags:
      - Subscriptions
      summary: Создать подписку на отслеживание цены
      description: 'Создаёт подписку на маршрут. Опция considerTPremiumPrivileges доступна только пользователям
        с активным статусом Т-Премиум/Private.

        '
      operationId: createSubscription
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequest'
      responses:
        '201':
          description: Подписка успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректное тело запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Опция учёта привилегий недоступна без активного Т-Премиума
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Опция учёта привилегий недоступна без активного Т-Премиума
        '409':
          description: Активная подписка с таким же маршрутом и датами уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SUBSCRIPTION_CONFLICT
                  message: Активная подписка с таким же маршрутом и датами уже существует
        '422':
          description: Ошибка валидации полей запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Ошибка валидации полей запроса
                  details:
                  - field: departureDate
                    issue: должна быть датой не раньше завтрашнего дня
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
  /subscriptions/{subscriptionId}:
    parameters:
    - $ref: '#/components/parameters/SubscriptionIdPath'
    - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags:
      - Subscriptions
      summary: Получить подписку по идентификатору
      operationId: getSubscriptionById
      responses:
        '200':
          description: Подписка найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '403':
          description: Недостаточно прав для просмотра данной подписки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Недостаточно прав для просмотра данной подписки
        '404':
          description: Подписка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SUBSCRIPTION_NOT_FOUND
                  message: Подписка не найдена
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    put:
      tags:
      - Subscriptions
      summary: Полностью заменить подписку
      operationId: replaceSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequest'
      responses:
        '200':
          description: Подписка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректное тело запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '404':
          description: Подписка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SUBSCRIPTION_NOT_FOUND
                  message: Подписка не найдена
        '409':
          description: Конфликт — подписка с такими параметрами уже существует у другого маршрута
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SUBSCRIPTION_CONFLICT
                  message: Конфликт — подписка с такими параметрами уже существует у другого маршрута
        '422':
          description: Ошибка валидации полей запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Ошибка валидации полей запроса
                  details:
                  - field: departureDate
                    issue: должна быть датой не раньше завтрашнего дня
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Внутренняя ошибка сервера
    patch:
      tags:
      - Subscriptions
      summary: Частично обновить подписку
      description: Например, включить/выключить опцию considerTPremiumPrivileges или поставить подписку
        на паузу.
      operationId: updateSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPatchRequest'
      responses:
        '200':
          description: Подписка частично обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Некорректное тело запроса
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Пользователь не авторизован
        '404':
          description: Подписка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SUBSCRIPTION_NOT_FOUND
                  message: Подписка не найдена
        '422':
          description: Ошибка валидации полей запроса (например, опция включена без активного Т-Премиума)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
