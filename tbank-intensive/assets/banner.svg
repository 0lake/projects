<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="T-Travel Price Tracker with T-Premium privileges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161a"/>
      <stop offset="1" stop-color="#23262d"/>
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="10%" r="60%">
      <stop offset="0" stop-color="#FFDD2D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFDD2D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <!-- price-drop line and ticket mark -->
  <g transform="translate(830 70)">
    <polyline points="0,40 70,30 130,70 190,60 250,130 330,170" fill="none" stroke="#FFDD2D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="170" r="10" fill="#FFDD2D"/>
    <circle cx="330" cy="170" r="22" fill="#FFDD2D" fill-opacity="0.2"/>
    <rect x="262" y="-8" width="150" height="54" rx="12" fill="#FFDD2D"/>
    <text x="337" y="28" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#14161a">T-Premium</text>
  </g>

  <rect x="72" y="70" width="72" height="6" rx="3" fill="#FFDD2D"/>
  <text x="72" y="130" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFDD2D" letter-spacing="3">T-TRAVEL  ·  T-BANK INTENSIVE</text>
  <text x="72" y="196" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Price Tracker</text>
  <text x="72" y="244" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#c3c7cf">from the cheapest ticket to the most profitable trip</text>
  <text x="72" y="284" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="19" fill="#868b95">PRD  ·  OpenAPI  ·  A/B test design  ·  R</text>
</svg>
