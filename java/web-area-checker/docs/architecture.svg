<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="920" height="510" font-family="Helvetica, Arial, sans-serif"><rect width="920" height="510" fill="#f7f5ff"/><rect x="340" y="24" width="240" height="66" rx="12" fill="#fff" stroke="#8a7fe0" stroke-width="1.8"/><path d="M340 36a12 12 0 0 1 12 -12H568a12 12 0 0 1 12 12V58H340Z" fill="#8a7fe0"/><text x="354" y="47" font-size="14" fill="#fff" font-weight="bold" text-anchor="start">Браузер</text><text x="354" y="80" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">форма, график, клик по графику</text><rect x="30" y="150" width="380" height="148" rx="12" fill="#fff" stroke="#6c5ce7" stroke-width="1.8"/><path d="M30 162a12 12 0 0 1 12 -12H398a12 12 0 0 1 12 12V184H30Z" fill="#6c5ce7"/><text x="44" y="173" font-size="14" fill="#fff" font-weight="bold" text-anchor="start">servlets-jsp (Tomcat 10.1)</text><text x="44" y="206" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">ControllerServlet: маршрутизация</text><text x="44" y="226" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">AreaCheckServlet: проверка и ответ</text><text x="44" y="246" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">ResultStore: история в сессии</text><text x="44" y="266" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">index.jsp, result.jsp, JSTL, c:out</text><rect x="510" y="150" width="380" height="148" rx="12" fill="#fff" stroke="#4a3fc4" stroke-width="1.8"/><path d="M510 162a12 12 0 0 1 12 -12H878a12 12 0 0 1 12 12V184H510Z" fill="#4a3fc4"/><text x="524" y="173" font-size="14" fill="#fff" font-weight="bold" text-anchor="start">jsf-app (WildFly)</text><text x="524" y="206" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">AreaBean: SessionScoped, CDI</text><text x="524" y="226" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">PointRepository: JDBC</text><text x="524" y="246" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">main.xhtml, PrimeFaces, SVG-график</text><text x="524" y="266" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">schema.sql при первом запуске</text><rect x="30" y="360" width="600" height="128" rx="12" fill="#fff" stroke="#12a37f" stroke-width="1.8"/><path d="M30 372a12 12 0 0 1 12 -12H618a12 12 0 0 1 12 12V394H30Z" fill="#12a37f"/><text x="44" y="383" font-size="14" fill="#fff" font-weight="bold" text-anchor="start">core (чистая Java 17, без зависимостей)</text><text x="44" y="416" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">Checker: разбор строк, диапазоны, расчёт попадания</text><text x="44" y="436" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">Region: CircleTriangleSquare, RectTriangleCircle</text><text x="44" y="456" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">Range, Radius, CheckInput, CheckResult</text><text x="44" y="476" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">InvalidInputException, JUnit-тесты границ</text><rect x="700" y="360" width="190" height="90" rx="12" fill="#fff" stroke="#2f7fd0" stroke-width="1.8"/><path d="M700 372a12 12 0 0 1 12 -12H878a12 12 0 0 1 12 12V394H700Z" fill="#2f7fd0"/><text x="714" y="383" font-size="14" fill="#fff" font-weight="bold" text-anchor="start">PostgreSQL</text><text x="714" y="416" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">таблица points</text><text x="714" y="436" font-size="12.5" fill="#1a1445" font-weight="normal" text-anchor="start">точки по сессиям</text><path d="M400 90L228.5 147.2" stroke="#4a3fc4" stroke-width="2"/><path d="M220 150L227.0 142.4L230.1 151.9Z" fill="#4a3fc4"/><text x="290" y="116" font-size="11.5" fill="#6b6884" font-weight="normal" text-anchor="start">HTTP</text><path d="M520 90L691.5 147.2" stroke="#4a3fc4" stroke-width="2"/><path d="M700 150L689.9 151.9L693.0 142.4Z" fill="#4a3fc4"/><text x="616" y="116" font-size="11.5" fill="#6b6884" font-weight="normal" text-anchor="start">HTTP + AJAX</text><path d="M220 298L220.0 351.0" stroke="#4a3fc4" stroke-width="2"/><path d="M220 360L215.0 351.0L225.0 351.0Z" fill="#4a3fc4"/><path d="M560 298L467.6 355.3" stroke="#4a3fc4" stroke-width="2"/><path d="M460 360L465.0 351.0L470.3 359.5Z" fill="#4a3fc4"/><path d="M800 298L800.0 351.0" stroke="#4a3fc4" stroke-width="2" stroke-dasharray="6 5"/><path d="M800 360L795.0 351.0L805.0 351.0Z" fill="#4a3fc4"/><text x="808" y="334" font-size="11.5" fill="#6b6884" font-weight="normal" text-anchor="start">JDBC</text></svg>