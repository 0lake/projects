# Только база данных для JSF-приложения. Само приложение разворачивается на WildFly.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: area
      POSTGRES_USER: area
      POSTGRES_PASSWORD: ${AREA_DB_PASSWORD:-area}
    ports:
      - "5432:5432"
    volumes:
      - area-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U area -d area"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  area-data:
