# PostgreSQL для локального запуска сервера.
# Пароль можно переопределить: FLATS_DB_PASSWORD=... docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flats
      POSTGRES_USER: flats
      POSTGRES_PASSWORD: ${FLATS_DB_PASSWORD:-flats}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flats-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flats -d flats"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flats-data:
